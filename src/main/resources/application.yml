server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: smart-parking-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_parking}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

parking:
  qr:
    in-payload: "SMARTPARKING:IN:GATE01"